name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths: ['apps-script.js']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Configure credentials
        run: |
          echo '${{ secrets.CLASP_CLASPRC }}' > ~/.clasprc.json
          chmod 600 ~/.clasprc.json

      - name: Configure .clasp.json
        run: |
          echo '{"scriptId":"${{ secrets.CLASP_SCRIPT_ID }}","rootDir":"."}' > .clasp.json

      - name: Prepare Code.gs
        run: cp apps-script.js Code.gs

      - name: Push to Apps Script
        run: clasp push --force 2>&1
        continue-on-error: false

      - name: Create version and redeploy
        run: |
          DESC="Deploy $(date +'%Y-%m-%d %H:%M')"
          VERSION=$(clasp version "$DESC" 2>&1 | grep -oP 'Created version \K[0-9]+' || echo "")
          if [ -n "$VERSION" ]; then
            clasp redeploy "${{ secrets.CLASP_DEPLOYMENT_ID }}" "$VERSION" "$DESC" && echo "✅ Deploy versão $VERSION"
          else
            echo "⚠️ Versão não capturada, tentando deploy novo"
            clasp deploy --description "$DESC"
          fi
