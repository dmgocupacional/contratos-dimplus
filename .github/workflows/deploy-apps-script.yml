name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths: ['apps-script.js']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get fresh access token
        id: token
        run: |
          RESPONSE=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d "client_id=${{ secrets.GOOGLE_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            -d "refresh_token=${{ secrets.GOOGLE_REFRESH_TOKEN }}" \
            -d "grant_type=refresh_token")
          ACCESS_TOKEN=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))")
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "❌ Erro token: $RESPONSE"; exit 1
          fi
          echo "access_token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT
          echo "✅ Token obtido"

      - name: Build payload
        run: |
          python3 - << 'PYEOF'
          import json
          with open('apps-script.js') as f:
              script = f.read()
          with open('appsscript.json') as f:
              manifest = f.read()
          payload = {
              "files": [
                  {"name": "Code", "type": "SERVER_JS", "source": script},
                  {"name": "appsscript", "type": "JSON", "source": manifest}
              ]
          }
          with open('/tmp/payload.json', 'w') as f:
              json.dump(payload, f)
          print(f"✅ Payload gerado — {len(script)} chars")
          PYEOF

      - name: Push code to Apps Script
        run: |
          RESPONSE=$(curl -s -X PUT \
            "https://script.googleapis.com/v1/projects/${{ secrets.CLASP_SCRIPT_ID }}/content" \
            -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/payload.json)
          echo "Resposta: $RESPONSE"
          if echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); exit(0 if 'error' not in d else 1)"; then
            echo "✅ Código enviado"
          else
            echo "❌ Erro no push — verifique se o script está vinculado ao GCP correto"
            echo "Fix: Apps Script → ⚙️ Configurações → GCP Project → coloque o número: $(curl -s -H 'Authorization: Bearer ${{ steps.token.outputs.access_token }}' 'https://cloudresourcemanager.googleapis.com/v1/projects?filter=name:My First Project' | python3 -c 'import sys,json; p=json.load(sys.stdin).get(\"projects\",[{}]); print(p[0].get(\"projectNumber\",\"?\") if p else \"?\")')"
            exit 1
          fi

      - name: Create version
        id: version
        run: |
          RESPONSE=$(curl -s -X POST \
            "https://script.googleapis.com/v1/projects/${{ secrets.CLASP_SCRIPT_ID }}/versions" \
            -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
            -H "Content-Type: application/json" \
            -d "{\"description\": \"Auto deploy $(date +'%Y-%m-%d %H:%M')\"}")
          echo "Versão response: $RESPONSE"
          VERSION=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('versionNumber',''))")
          if [ -z "$VERSION" ]; then echo "❌ Erro versão"; exit 1; fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "✅ Versão $VERSION criada"

      - name: Update deployment
        run: |
          RESPONSE=$(curl -s -X PUT \
            "https://script.googleapis.com/v1/projects/${{ secrets.CLASP_SCRIPT_ID }}/deployments/${{ secrets.CLASP_DEPLOYMENT_ID }}" \
            -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
            -H "Content-Type: application/json" \
            -d "{\"deploymentConfig\":{\"versionNumber\":${{ steps.version.outputs.version }},\"manifestFileName\":\"appsscript\",\"description\":\"Auto deploy\"}}")
          echo "Deploy response: $RESPONSE"
          if echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); exit(1 if 'error' in d else 0)"; then
            echo "✅ Deployment atualizado — v${{ steps.version.outputs.version }}"
          else
            echo "❌ Erro deployment"; exit 1
          fi
