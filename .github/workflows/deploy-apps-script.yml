name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths: ['apps-script.js']

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get access token
        id: token
        run: |
          RESP=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d "client_id=${{ secrets.GOOGLE_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            -d "refresh_token=${{ secrets.GOOGLE_REFRESH_TOKEN }}" \
            -d "grant_type=refresh_token")
          TOKEN=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))")
          if [ -z "$TOKEN" ]; then echo "❌ Token: $RESP"; exit 1; fi
          echo "access_token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Build payload
        run: |
          python3 - << 'PYEOF'
          import json
          payload = {"files":[
            {"name":"Code","type":"SERVER_JS","source":open('apps-script.js').read()},
            {"name":"appsscript","type":"JSON","source":open('appsscript.json').read()}
          ]}
          json.dump(payload, open('/tmp/payload.json','w'))
          PYEOF

      - name: Push content
        run: |
          RESP=$(curl -s -X PUT \
            "https://script.googleapis.com/v1/projects/${{ secrets.CLASP_SCRIPT_ID }}/content" \
            -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/payload.json)
          echo "PUSH_RESP=$RESP"
          # Salvar resposta em arquivo para commit
          echo "$RESP" > /tmp/push_resp.txt
          if echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); exit(1 if 'error' in d else 0)"; then
            echo "✅ Código enviado"
          else
            # Commitar resposta de erro no repo para diagnóstico
            cp /tmp/push_resp.txt debug_response.txt
            git config user.email "actions@github.com"
            git config user.name "GitHub Actions"
            git add debug_response.txt
            git commit -m "debug: resposta erro Apps Script API [skip ci]"
            git push origin main
            exit 1
          fi

      - name: Create version
        id: version
        run: |
          RESP=$(curl -s -X POST \
            "https://script.googleapis.com/v1/projects/${{ secrets.CLASP_SCRIPT_ID }}/versions" \
            -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
            -H "Content-Type: application/json" \
            -d "{\"description\":\"Auto deploy $(date +'%Y-%m-%d %H:%M')\"}")
          V=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('versionNumber',''))")
          if [ -z "$V" ]; then echo "❌ Versão: $RESP"; exit 1; fi
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "✅ Versão $V"

      - name: Update deployment
        run: |
          RESP=$(curl -s -X PUT \
            "https://script.googleapis.com/v1/projects/${{ secrets.CLASP_SCRIPT_ID }}/deployments/${{ secrets.CLASP_DEPLOYMENT_ID }}" \
            -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
            -H "Content-Type: application/json" \
            -d "{\"deploymentConfig\":{\"versionNumber\":${{ steps.version.outputs.version }},\"manifestFileName\":\"appsscript\",\"description\":\"Auto deploy\"}}")
          echo "$RESP"
          if echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); exit(1 if 'error' in d else 0)"; then
            echo "🎉 Deploy v${{ steps.version.outputs.version }} — SUCESSO!"
          else
            echo "❌ Deploy: $RESP"; exit 1
          fi
